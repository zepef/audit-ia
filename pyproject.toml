[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-ia"
version = "0.1.0"
description = "Audit de l'intégration de l'IA dans les entreprises françaises (1 à 249 salariés)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "pyyaml", "jinja2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
audit-ia = "audit_ia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
